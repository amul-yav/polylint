[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polylint"
version = "0.1.0"
description = "A fast, multi-language linter and formatter"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich"
]

[project.scripts]
polylint = "polylint.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]